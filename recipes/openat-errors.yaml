id: openat-errors
title: Failed opens (EACCES/ENOENT)
description: Streams openat failures with the process, path, and errno. Bursts of ENOENT suggest probing; EACCES suggests permission problems or snooping.
tags: [security, filesystem, errors, audit]
view: events
duration_default: 10
min_kernel: "5.8"
requires:
  [
    "tracepoint:syscalls:sys_enter_openat",
    "tracepoint:syscalls:sys_exit_openat",
    "tracepoint:syscalls:sys_enter_openat2",
    "tracepoint:syscalls:sys_exit_openat2",
  ]
params: []
