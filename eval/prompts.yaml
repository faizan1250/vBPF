# vBPF eval prompts (mock-only harness).
# Categories encoded in id prefix: direct- (10), paraphrased- (8), param- (4),
# novel- (4), adversarial- (4, must_refuse: true).
# expected_view uses the recipe view enum: table | bar | histogram | timeseries | events.
- id: direct-01
  prompt: Which processes are using the most CPU?
  expected_view: bar
  expected_probe_family: profile
  must_refuse: false
  notes: direct mapping to cpu-by-process
- id: direct-02
  prompt: Show me a histogram of block I/O latency
  expected_view: histogram
  expected_probe_family: tracepoint:block
  must_refuse: false
  notes: direct mapping to block-latency-histogram
- id: direct-03
  prompt: Stream DNS lookups with the calling process
  expected_view: events
