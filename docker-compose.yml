# vBPF compose quickstart: `cp .env.example .env && docker compose up --build`.
# Only the web front door is published. The agent is reachable solely inside
# this network (no ports published) and still requires its bearer token on
# every endpoint. The API binds 0.0.0.0 but keeps its Host/Origin gates, so
# set WEB_ORIGIN to the exact browser-facing URL when WEB_PORT changes.
# Hardening details live in docs/deployment.md.
services:
  agent:
    build:
      context: .
      dockerfile: ./agent/Dockerfile
    # Minimal tracing caps instead of full root (I-08, D-84): BPF program
    # load (BPF), kprobe/tracepoint attach (PERFMON), BPF map memlock
    # (SYS_RESOURCE). No `privileged`, no `pid: host` (probes are
    # kernel-wide; the container's own PID namespace is enough), and
    # no-new-privileges blocks setuid escalation. Tracefs/debugfs are
    # mounted read-only; if bpftrace ever needs a write there, use the
    # documented fallback in docker-compose.privileged.yml and record why.
    cap_add:
      - BPF
      - PERFMON
      - SYS_RESOURCE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Separate loopbacks per container, so the agent binds the wildcard here;
    # the code only allows it with AGENT_ALLOW_WILDCARD_BIND=1 (see security.md).
    command:
      ["serve", "--addr", "0.0.0.0:8787", "--token-file", "/token/agent.token"]
    environment:
      AGENT_ALLOW_WILDCARD_BIND: "1"
    volumes:
      - agent-token:/token
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
    networks:
      - vbpf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf -H "Authorization: Bearer $$(cat /token/agent.token)" http://127.0.0.1:8787/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      AGENT_URL: http://agent:8787
      AGENT_TOKEN_FILE: /token/agent.token
      DATABASE_PATH: /data/api.sqlite3
      RECIPES_DIR: /app/recipes
      # Trust X-Forwarded-For only from the nginx peer on this network;
      # direct clients fall back to the socket address (see deployment.md).
      TRUST_PROXY: "172.28.0.0/16"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-5173}}
    volumes:
      - agent-token:/token:ro
      - api-data:/data
    networks:
      - vbpf
    # Unprivileged at runtime: the entrypoint stages the token then re-execs
    # node as uid 1000 (no root PID left). Read-only rootfs with tmpfs for
    # temp and the staged token; /data stays a named volume owned by node.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/vbpf
    mem_limit: 512m
    pids_limit: 100
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    networks:
      - vbpf
    # Unprivileged nginx image (uid 101, port 8080), read-only rootfs with
    # tmpfs for cache, pid, and temp files.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    mem_limit: 128m
    pids_limit: 50
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  agent-token:
  api-data:

# Fixed subnet so TRUST_PROXY can name the nginx service network explicitly.
networks:
  vbpf:
    ipam:
      config:
        - subnet: 172.28.0.0/16
