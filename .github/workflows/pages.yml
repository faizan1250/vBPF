# I-17 hosted fixture demo: builds the web app with VITE_FIXTURE_MODE=1 and
# deploys the static dist to GitHub Pages. Fully static: no API, no network
# calls, no keys. The maintainer enables Pages once (Settings -> Pages ->
# Source: GitHub Actions); pushes to main then refresh the demo.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The repo is served from a subpath on Pages (https://<owner>.github.io/vBPF/).
  VITE_BASE_PATH: /vBPF/

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install JS deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build fixture demo (static, no backend)
        run: VITE_FIXTURE_MODE=1 pnpm -C web run build
      - name: SPA fallback for the Pages subpath
        run: |
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll
      - name: Install Playwright chromium
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Offline E2E against dist (network blocked)
        run: pnpm -C web run test:e2e:offline
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
