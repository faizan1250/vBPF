# vBPF CI skeleton. Mock-only: no secrets, no root, no privileged runs.
# Tool versions: Go floor from agent/go.mod (min job) plus latest
# verified 1.27.x; Node 22 LTS, pnpm 9.x pinned.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LLM_MODE: mock # mock-only CI; real LLM runs never happen here (LLM_UNAVAILABLE fallback)

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install JS deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install shellcheck
        run: |
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq; then break; fi
            if [ "$i" -eq 5 ]; then exit 1; fi
            echo "apt-get update failed (attempt $i/5), retrying in 10s..."
            sleep 10
          done
          sudo apt-get install -y -qq shellcheck
      - name: Install golangci-lint (pinned)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: make lint (skips absent dirs, no root needed)
        run: make lint

  test-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install JS deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: make test (no root, skips absent dirs)
        run: make test
      - name: go test -race (agent, no root)
        run: |
          if [ -d agent ]; then cd agent && go test -race ./...; \
          else echo "SKIP: no agent/ yet"; fi

  # Go unit tests on the minimum supported toolchain (floor from
  # agent/go.mod). test-unit above runs the same suite on latest (1.27.x).
  test-unit-min:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
      - name: go test -race on minimum Go (agent, no root)
        run: cd agent && go test -race ./...

  # Deterministic Go tests (I-06): repeat + race + shuffle so ordering and
  # flake bugs surface. No root, no bpftrace needed (integration-tagged
  # tests skip without them).
  test-determinism:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
      - name: make test-determinism (repeat + race + shuffle, no root)
        run: make test-determinism

  # Shared validator parity (I-04): shape gate plus the Go and TS vector
  # suites. Fails when a vector exists that only one side executes.
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install JS deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: make parity (shared validator vectors, no root needed)
        run: make parity

  # Kernel/platform matrix freshness (I-12): generated docs match
  # compat/*.json. Static check, mock-only, no root, no secrets.
  compat-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: render-compat --check (generated docs fresh, no root needed)
        run: node scripts/render-compat.mjs --check

  # Docs truthfulness (I-09): documented agent flags, env vars, make
  # targets, ports, helper scripts, and relative links match the code.
  # Static check, mock-only, no root, no secrets.
  docs-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: bash scripts/check-docs.sh (no root needed)
        run: bash scripts/check-docs.sh

  # Go native fuzzing (I-05): short pass per target with committed seeds.
  # No root, no bpftrace needed. Longer soaks are manual via FUZZ_TIME.
  fuzz-short:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
      - name: make fuzz (short pass, no root needed)
        run: make fuzz

  # Dependency vulnerability scan (Go). Mock-only, no secrets.
  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
      - name: Install govulncheck (pinned)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: make vuln (skips absent dirs, no root needed)
        run: make vuln

  # Secret scan (R-22 keys hygiene). Mock-only, no secrets.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Contract check against a fake agent fixture (agent serves 127.0.0.1:8787
  # in production; here a stub stands in so the job passes with no code).
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install JS deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Contract check vs fake agent
        run: |
          if [ -d contract ]; then pnpm -C contract run check; \
          else echo "SKIP: no contract/ fixtures yet (fake-agent check deferred)"; fi

  # JS vulnerability gate (I-15): fails on high/critical findings unless
  # each is covered by an unexpired .github/audit-allowlist.json entry
  # (reason + expiry required). Mock-only, no secrets.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install JS deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: make audit (high/critical gate, no secrets needed)
        run: make audit

  # SBOM (I-15): SPDX JSON for the agent binary (inside the agent image)
  # and all three container images, kept as a CI artifact. The release
  # workflow (I-16) reuses the same anchore step and attaches the files.
  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build images with local tags (no push)
        run: |
          docker build -t vbpf-agent:ci -f agent/Dockerfile .
          docker build -t vbpf-api:ci -f api/Dockerfile .
          docker build -t vbpf-web:ci -f web/Dockerfile .
      - name: SBOM for agent image (embeds the agent binary)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: vbpf-agent:ci
          format: spdx-json
          output-file: sbom-agent.spdx.json
      - name: SBOM for api image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: vbpf-api:ci
          format: spdx-json
          output-file: sbom-api.spdx.json
      - name: SBOM for web image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: vbpf-web:ci
          format: spdx-json
          output-file: sbom-web.spdx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom-*.spdx.json
          if-no-files-found: error

  # Supply-chain gate (I-15): actionlint over every workflow plus the
  # static checks (pins, dependabot/codeql/scorecard config, allowlist,
  # docs). Mock-only, no secrets.
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
      - name: Install actionlint (pinned)
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: actionlint (all workflows)
        run: actionlint
      - name: make supply-chain-check (static, no secrets needed)
        run: make supply-chain-check

  # Mocked end-to-end: Playwright, chromium only, mock fixtures only.
  e2e-mocked:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install JS deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Playwright e2e with mock fixtures (chromium only)
        run: |
          if [ -d web ]; then
            pnpm -C web exec playwright install --with-deps chromium
            pnpm -C web run test:e2e
          else
            echo "SKIP: no web/ yet (chromium e2e deferred to mock fixtures)"
          fi
      - name: Offline fixture-demo E2E against dist (network blocked)
        run: |
          if [ -d web ]; then
            VITE_FIXTURE_MODE=1 VITE_BASE_PATH=/vBPF/ pnpm -C web run build
            VITE_BASE_PATH=/vBPF/ pnpm -C web run test:e2e:offline
          else
            echo "SKIP: no web/ yet (offline fixture demo deferred)"
          fi

  # Eval harness in mock mode. No secrets are set or read here by design.
  eval-mock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install JS deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: make eval (mock mode, no secrets)
        run: make eval

  # Image build only: never pushed, never run privileged in CI.
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate compose config
        run: docker compose config --quiet
      - name: Validate nginx config against the pinned image
        run: |
          PINNED="$(sed -n 's/^FROM //p' web/Dockerfile | tail -n 1)"
          docker run --rm --add-host=api:127.0.0.1 -v "$PWD/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" "$PINNED" nginx -t
      - name: Build images (no push, no privileged run)
        run: docker compose build
