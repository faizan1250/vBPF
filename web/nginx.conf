# Same-origin front door: nginx serves the built UI and proxies /api and /ws
# to the API container, so the browser keeps one origin (the API enforces an
# exact-match Origin allowlist, never *).
#
# Hardening notes (see docs/deployment.md): no server version banner, a 64k
# body cap on the API location, short connect/send timeouts (read stays 120s
# for streaming), and an nginx-side limit_req second layer on the two
# LLM-backed endpoints (the API also enforces its own 10 req/min/IP bucket).
# HSTS is intentionally absent: this front door serves plain HTTP behind
# loopback, and HSTS on plain HTTP would be ignored at best; terminate TLS
# in front and set HSTS there.
limit_req_zone $binary_remote_addr zone=llm:10m rate=10r/m;

upstream api {
  server api:8080;
}

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Server-level headers are inherited by every location below (none sets its
  # own add_header). `always` covers error responses too.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Vite emits external assets only (no inline scripts); inline styles and
  # blob: workers stay allowed for React/Monaco runtime needs.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  location = /api/generate {
    limit_req zone=llm burst=5 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    client_max_body_size 64k;
    proxy_pass http://api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # LLM budget runs up to 90 s; cap margin above it so slow generations
    # are not cut off with a 504.
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
  }

  location = /api/explain {
    limit_req zone=llm burst=5 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    client_max_body_size 64k;
    proxy_pass http://api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    client_max_body_size 64k;
    proxy_pass http://api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # LLM budget runs up to 90 s; cap margin above it so slow generations
    # are not cut off with a 504.
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
  }

  location /ws/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Run streams last up to the 60 s max duration; same margins as /api/.
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
  }
}
