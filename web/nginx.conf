# Same-origin front door: nginx serves the built UI and proxies /api and /ws
# to the API container, so the browser keeps one origin (the API enforces an
# exact-match Origin allowlist, never *).
upstream api {
  server api:8080;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $http_host;
  }

  location /ws/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }
}
